name: Build Check

# O deploy de produção é feito pelo EasyPanel (build via Dockerfile), não por
# este workflow. Antes este arquivo tentava deployar na Vercel — mas os secrets
# do Vercel nunca existiram e a condição `if` acessava o contexto `secrets`
# diretamente, o que é inválido e derrubava o workflow inteiro (falha em 0s).
#
# Agora ele apenas valida que a aplicação BUILDA no push da main — pegando erros
# de build (que lint/testes do ci.yml não pegam) antes de o EasyPanel tentar.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
